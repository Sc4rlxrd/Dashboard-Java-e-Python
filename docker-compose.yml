name: price-monitor

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        DASHBOARD_UID: "${DASHBOARD_UID:-1000}"
        DASHBOARD_GID: "${DASHBOARD_GID:-1000}"
        
    environment:
      PRICE_DATA_FILE: /app/data/precos.json
      URLS_FILE: /app/config/urls.txt

    ports:
      - "127.0.0.1:8501:8501"

    volumes:
      - ./dadosParaDashBoards:/app/data:ro,z
      - ./datacollector/urls.txt:/app/config/urls.txt:rw,z
    restart: unless-stopped
    init: true

    networks:
      - frontend

  collector:
    profiles:
      - collector

    build:
      context: ./datacollector
      dockerfile: Dockerfile

    environment:
      H2_DATABASE_PATH: /app/data/price-monitor
      SPRING_DATASOURCE_USERNAME: sa
      JPA_DDL_AUTO: update

      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+ExitOnOutOfMemoryError

      CHROME_BIN: /usr/bin/chromium-browser
      CHROMEDRIVER_PATH: /usr/bin/chromedriver

      COLLECTOR_URLS_FILE: /app/urls.txt
      COLLECTOR_OUTPUT_FILE: /app/data/precos.json
      COLLECTOR_DELAY_MS: "${COLLECTOR_DELAY_MS:-8000}"
      COLLECTOR_LOG_LEVEL: "${COLLECTOR_LOG_LEVEL:-INFO}"

    volumes:
      - ./datacollector/urls.txt:/app/urls.txt:ro,Z
      - ./dadosParaDashBoards:/app/data:rw,z

    restart: "no"
    init: true

    networks:
      - egress

networks:
  frontend:
    driver: bridge

  egress:
    driver: bridge