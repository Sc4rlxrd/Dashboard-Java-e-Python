name: Publish images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish multi-platform Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 90

    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master'
      )

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run'
              && github.event.workflow_run.head_sha
              || github.sha
            }}

      - name: Configure QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Show supported build platforms
        run: docker buildx inspect --bootstrap

      - name: Authenticate with GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image version
        id: version
        shell: bash
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${FULL_SHA:0:7}"

          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Publishing revision: ${FULL_SHA}"
          echo "Image tag: sha-${SHORT_SHA}"

      - name: Build and publish dashboard
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sc4rlxrd/price-monitor-dashboard:latest
            ghcr.io/sc4rlxrd/price-monitor-dashboard:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Price Monitor Dashboard
            org.opencontainers.image.description=Streamlit price monitoring dashboard
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build and publish collector
        uses: docker/build-push-action@v7
        with:
          context: ./datacollector
          file: ./datacollector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sc4rlxrd/price-monitor-collector:latest
            ghcr.io/sc4rlxrd/price-monitor-collector:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Price Monitor Collector
            org.opencontainers.image.description=Java and Selenium price collector
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector

      - name: Verify dashboard image platforms
        shell: bash
        run: |
          docker buildx imagetools inspect \
            ghcr.io/sc4rlxrd/price-monitor-dashboard:latest

      - name: Verify collector image platforms
        shell: bash
        run: |
          docker buildx imagetools inspect \
            ghcr.io/sc4rlxrd/price-monitor-collector:latest