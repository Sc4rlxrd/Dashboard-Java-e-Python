name: CI

on:
  push:
    branches:
      - master
      - dev
      - "feature/**"
      - "refactor/**"
      - "fix/**"

  pull_request:
    branches:
      - master
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: Collector · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: datacollector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: datacollector/pom.xml

      - name: Build and test collector
        run: |
          chmod +x mvnw

          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify

  dashboard:
    name: Dashboard · Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q dashboard.py

      - name: Validate dashboard dependencies
        run: |
          python - <<'PY'
          import pandas
          import plotly
          import streamlit

          print("Dashboard dependencies imported successfully.")
          PY

  compose:
    name: Docker Compose · Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Docker Compose
        run: |
          docker compose \
            --profile collector \
            config --quiet

  images:
    name: Docker · Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs:
      - collector
      - dashboard
      - compose

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: dashboard
            context: .
            dockerfile: ./Dockerfile.dashboard
            cache_scope: ci-dashboard

          - image: collector
            context: ./datacollector
            dockerfile: ./datacollector/Dockerfile
            cache_scope: ci-collector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Show supported build platforms
        run: docker buildx inspect --bootstrap

      - name: Build multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}