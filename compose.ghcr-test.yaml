name: price-monitor-ghcr-test

services:
  collector:
    image: ghcr.io/sc4rlxrd/price-monitor-collector:${IMAGE_TAG:-sha-3ecebf8}
    platform: ${TARGET_PLATFORM:-linux/amd64}

    environment:
      H2_DATABASE_PATH: /app/data/price-monitor
      SPRING_DATASOURCE_USERNAME: sa
      JPA_DDL_AUTO: update

      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:+ExitOnOutOfMemoryError

      CHROME_BIN: /usr/bin/chromium-browser
      CHROMEDRIVER_PATH: /usr/bin/chromedriver

      COLLECTOR_ENABLED: "true"
      COLLECTOR_URLS_FILE: /app/urls.txt
      COLLECTOR_OUTPUT_FILE: /app/data/precos.json
      COLLECTOR_DELAY_MS: "${COLLECTOR_DELAY_MS:-8000}"
      COLLECTOR_LOG_LEVEL: "${COLLECTOR_LOG_LEVEL:-INFO}"

    volumes:
      - ./datacollector/urls.txt:/app/urls.txt:ro,Z
      - ${DATA_DIR:-./dadosParaDashBoards}:/app/data:rw,z

    restart: "no"
    init: true

    networks:
      - egress

  dashboard:
    image: ghcr.io/sc4rlxrd/price-monitor-dashboard:${IMAGE_TAG:-sha-3ecebf8}
    platform: ${TARGET_PLATFORM:-linux/amd64}

    depends_on:
      collector:
        condition: service_completed_successfully

    environment:
      PRICE_DATA_FILE: /app/data/precos.json

    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"

    volumes:
      - ${DATA_DIR:-./dadosParaDashBoards}:/app/data:ro,z

    restart: unless-stopped
    init: true

    networks:
      - frontend

networks:
  frontend:
    driver: bridge

  egress:
    driver: bridge